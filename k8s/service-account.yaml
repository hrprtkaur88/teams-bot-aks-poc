apiVersion: v1
kind: ServiceAccount
metadata:
  name: teams-bot-workload-identity
  namespace: teams-bot-poc
  annotations:
    # AKS's Azure Workload Identity webhook reads this annotation to decide
    # which Microsoft Entra application/user-assigned identity to federate
    # the projected Kubernetes service-account token with.
    azure.workload.identity/client-id: "<managed-identity-client-id>"
    azure.workload.identity/tenant-id: "<tenant-id>"
