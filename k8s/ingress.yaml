apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-bot
  namespace: teams-bot-poc
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  rules:
    - host: <public-bot-host>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teams-bot
                port:
                  number: 80

