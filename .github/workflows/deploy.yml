name: build-and-deploy

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: Azure resource group
        required: true
      failureMode:
        description: Bot failure mode
        required: true
        default: none

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - name: Build app
        working-directory: src
        run: |
          npm ci
          npm run build
      - name: Build and push image
        shell: pwsh
        run: ./scripts/build-and-push-image.ps1 -ResourceGroupName "${{ github.event.inputs.resourceGroupName }}"
      - name: Deploy AKS manifests
        shell: pwsh
        run: ./scripts/deploy-aks.ps1 -ResourceGroupName "${{ github.event.inputs.resourceGroupName }}" -FailureMode "${{ github.event.inputs.failureMode }}"

